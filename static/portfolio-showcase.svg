<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%"   stop-color="#fcf9f8"/>
      <stop offset="100%" stop-color="#f5f0e8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="45%">
      <stop offset="0%"  stop-color="#c5f347" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#c5f347" stop-opacity="0"/>
    </radialGradient>
    <filter id="markShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1f4d3a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="url(#glow)"/>

  <!-- Mark: two overlapping circles, scaled down and positioned with clear space above the wordmark -->
  <g filter="url(#markShadow)" transform="translate(560,400) scale(0.5) translate(-505,-505)">
    <circle cx="440" cy="540" r="300" fill="#1f4d3a"/>
    <circle cx="680" cy="360" r="190" fill="#c5f347"/>
  </g>

  <!-- Wordmark -->
  <text
    x="540" y="700"
    text-anchor="middle"
    font-family="'Space Grotesk', -apple-system, 'Helvetica Neue', Arial, sans-serif"
    font-size="100"
    font-weight="700"
    fill="#1f4d3a"
    letter-spacing="-1"
  >Spady</text>
</svg>
